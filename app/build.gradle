plugins {
    id 'com.android.application'
}

android {
    namespace 'com.zoomerz.pokemine'
    compileSdk 34

    defaultConfig {
        applicationId 'com.zoomerz.pokemine'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    // index.html is ~9.8 MB: never compress/skip it oddly
    androidResources {
        noCompress 'html'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
